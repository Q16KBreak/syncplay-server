name: Update & Build & Publish

on:
  schedule:
    - cron: "13 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Get latest Python image digest
        id: python-image
        run: |
          echo "==> [1/4] Getting latest Python image digest..."

          DIGEST="$(
            docker buildx imagetools inspect python:3.14-alpine |
            awk '/^Digest:/ {print $2; exit}'
          )"

          if [ -z "$DIGEST" ]; then
            echo "Failed to get Python image digest."
            exit 1
          fi

          PYTHON_IMAGE="python:3.14-alpine@$DIGEST"

          echo "    Python image: $PYTHON_IMAGE"
          printf '%s\n' "$PYTHON_IMAGE" > python-image.digest

          echo "python_image=$PYTHON_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Generate requirements.lock
        run: |
          echo "==> [2/4] Generating requirements.lock..."

          PYTHON_IMAGE="$(cat python-image.digest)"

          docker run --rm \
            "$PYTHON_IMAGE" \
            sh -c '
              wget -qO /tmp/requirements.in \
                https://github.com/Syncplay/syncplay/raw/refs/heads/master/requirements.txt &&
              python -m pip install --no-cache-dir pip-tools >/dev/null 2>&1 &&
              pip-compile \
                --strip-extras \
                --quiet \
                --output-file=- \
                /tmp/requirements.in
            ' > requirements.lock

          echo "    requirements.lock generated."

      - name: Check for changes
        id: changes
        run: |
          echo "==> [3/4] Checking for changes..."

          if git diff --quiet -- python-image.digest requirements.lock; then
            echo "    No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "    Changes detected."
          git diff -- python-image.digest requirements.lock
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "==> [4/4] Committing changes..."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add python-image.digest requirements.lock

          git commit \
            -m "chore: update Python image and requirements lock"

          git push origin master

          echo "    Changes committed and pushed."
  build:
    needs: update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Get build inputs
        id: inputs
        run: |
          echo "==> [1/7] Getting build inputs..."

          BUILD_SHA="$(git rev-parse --short=7 HEAD)"

          SYNCPLAY_SHA="$(
            git ls-remote \
              https://github.com/Syncplay/syncplay.git \
              refs/heads/master |
            cut -f1
          )"

          if [ -z "$SYNCPLAY_SHA" ]; then
            echo "Failed to get Syncplay SHA."
            exit 1
          fi

          PYTHON_IMAGE="$(cat python-image.digest)"

          if [ -z "$PYTHON_IMAGE" ]; then
            echo "python-image.digest is empty."
            exit 1
          fi

          echo "    BUILD SHA:    $BUILD_SHA"
          echo "    Syncplay SHA: $SYNCPLAY_SHA"
          echo "    Python image: $PYTHON_IMAGE"

          echo "build_sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          echo "syncplay_sha=$SYNCPLAY_SHA" >> "$GITHUB_OUTPUT"
          echo "python_image=$PYTHON_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check latest published image
        id: check
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/syncplay-server
          BUILD_SHA: ${{ steps.inputs.outputs.build_sha }}
          SYNCPLAY_SHA: ${{ steps.inputs.outputs.syncplay_sha }}
        run: |
          echo "==> [2/7] Checking latest published image..."

          if ! docker pull "$IMAGE:latest"; then
            echo "    No existing image found."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REVISION="$(
            docker inspect "$IMAGE:latest" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )"

          if [ -z "$REVISION" ] || [ "$REVISION" = "<no value>" ]; then
            echo "    Existing image has no revision label."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PUBLISHED_SYNCPLAY_SHA="${REVISION%-*}"
          PUBLISHED_BUILD_SHA="${REVISION##*-}"

          echo "    Published Syncplay SHA: $PUBLISHED_SYNCPLAY_SHA"
          echo "    Published BUILD SHA:    $PUBLISHED_BUILD_SHA"

          if [ "$PUBLISHED_SYNCPLAY_SHA" != "$SYNCPLAY_SHA" ]; then
            echo "    Syncplay changed."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PUBLISHED_BUILD_SHA" != "$BUILD_SHA" ]; then
            echo "    Repository changed."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "    No changes detected."
          echo "build=false" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true

          build-args: |
            PYTHON_IMAGE=${{ steps.inputs.outputs.python_image }}
            SYNCPLAY_SHA=${{ steps.inputs.outputs.syncplay_sha }}
            BUILD_SHA=${{ steps.inputs.outputs.build_sha }}

          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/syncplay-server:latest
            ${{ vars.DOCKERHUB_USERNAME }}/syncplay-server:${{ steps.inputs.outputs.syncplay_sha }}-${{ steps.inputs.outputs.build_sha }}

          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/syncplay-server:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/syncplay-server:buildcache,mode=max

      - name: Build skipped
        if: steps.check.outputs.build == 'false'
        run: |
          echo "==> [7/7] Build skipped."
          echo "    Syncplay SHA and BUILD SHA are unchanged."