name: PR Validation

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Validate image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7

      - name: Get build inputs
        id: inputs
        run: |
          echo "==> Getting build inputs..."

          BUILD_SHA="$(git rev-parse --short=7 HEAD)"

          SYNCPLAY_SHA="$(
            git ls-remote \
              https://github.com/Syncplay/syncplay.git \
              refs/heads/master |
            cut -f1
          )"

          if [ -z "$SYNCPLAY_SHA" ]; then
            echo "Failed to get Syncplay SHA."
            exit 1
          fi

          echo "    BUILD SHA:    $BUILD_SHA"
          echo "    Syncplay SHA: $SYNCPLAY_SHA"

          echo "build_sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          echo "syncplay_sha=$SYNCPLAY_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            SYNCPLAY_SHA=${{ steps.inputs.outputs.syncplay_sha }}
            BUILD_SHA=${{ steps.inputs.outputs.build_sha }}
          cache-from: type=gha,scope=pr-validation
          cache-to: type=gha,mode=max,scope=pr-validation
