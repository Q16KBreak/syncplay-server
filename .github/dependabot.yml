version: 2

# 每 8 小时检查；随机选定上海时间 03:20、11:20、19:20。
# Dependabot cron 仅精确到分钟，不支持配置秒。
updates:
  # Python 依赖：requirements.in -> requirements.txt（pip-compile 产物）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "20 3,11,19 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10

  # 基础镜像：Dockerfile 中 digest 固定的 python:3.14-alpine
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "20 3,11,19 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5

  # Workflow 中使用的 GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "20 3,11,19 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
