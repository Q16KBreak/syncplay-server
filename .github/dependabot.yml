version: 2

# 每 24 小时检查一次；随机选定上海时间 22:49。
# 使用 cron 确保每天（含周末）执行。
updates:
  # Python 依赖：requirements.in -> requirements.txt（pip-compile 产物）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "49 22 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10

  # 基础镜像：Dockerfile 中 digest 固定的 python:3.14-alpine
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "49 22 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5

  # Workflow 中使用的 GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "49 22 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
